apiVersion: v1
kind: Namespace
metadata:
  name: petstore
  labels:
    app: petstore

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petstore-api
  namespace: petstore
  labels:
    app: petstore-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: petstore-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: petstore-api
    spec:
      containers:
        - name: petstore-api
          image: ${ACR_NAME}.azurecr.io/contoso-petstore:${IMAGE_TAG}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: APP_VERSION
              value: "${IMAGE_TAG}"
            - name: ApplicationInsights__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: petstore-secrets
                  key: appinsights-connection-string
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
